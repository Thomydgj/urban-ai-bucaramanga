services:
  - type: web
    name: urban-ai-backend
    runtime: python
    # Elige el plan en Render; no se selecciona uno de pago desde el Blueprint.
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: CORS_ORIGINS
        value: https://urban-ai-bucaramanga.vercel.app

  - type: web
    name: urban-ai-image-generation
    runtime: python
    buildCommand: pip install -r requirements-image-generation.txt
    startCommand: uvicorn ml.image_generation.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1.5
      - key: CORS_ORIGINS
        value: https://urban-ai-bucaramanga.vercel.app
